############################################################监控配置############################################################
#缺省[加密算法类型，默认：不填写]
monitoring.secure.encryption-algorithm-type=aes
#缺省[AES加密算法秘钥，默认：不填写]
monitoring.secure.aes.key=pqdOWnEkA3AQKyb7L2ewAA==
#缺省[DES加密算法秘钥，默认：不填写]
monitoring.secure.des.key=W21AB4W2nmg=
#缺省[SM4加密算法秘钥，默认：不填写]
monitoring.secure.sm4.key=UKW5kIkKmBHmL+yLV54tMg==
#必填[http通信url]
monitoring.comm.http.url=http://127.0.0.1:16000/phoenix-server
#缺省[连接超时时间（毫秒），默认：15秒]
monitoring.comm.http.connect-timeout=15000
#缺省[等待数据超时时间（毫秒），默认：15秒]
monitoring.comm.http.socket-timeout=15000
#缺省[从连接池获取连接的等待超时时间（毫秒），默认：15秒]
monitoring.comm.http.connection-request-timeout=15000
#缺省[websocket通信url，如果上游服务是监控服务端，默认为空，否则与http通信共用IP和端口]
monitoring.comm.websocket.url=ws://127.0.0.1:16001/phoenix-server
#缺省[实例次序（整数），默认为1]
monitoring.instance.order=1
#缺省[实例端点类型（server、agent、client、ui），默认：client]
monitoring.instance.endpoint=agent
#必填[实例名称，一般为项目名]
monitoring.instance.name=phoenix-agent
#缺省[实例描述，默认没有描述信息]
monitoring.instance.desc=监控代理端
#缺省[程序语言，默认：Java]
monitoring.instance.language=Java
#缺省[与服务端或者代理端发心跳包的频率（秒），默认30秒，最小不能小于30秒]
monitoring.heartbeat.rate=30
#缺省[是否采集服务器信息，默认false]
monitoring.server-info.enable=true
#缺省[与服务端或者代理端发服务器信息包的频率（秒），默认60秒，最小不能小于30秒]
monitoring.server-info.rate=30
#缺省[服务器本机ip地址，默认：自动获取]
monitoring.server-info.ip=
#缺省[服务器名称，默认：自动获取计算机名]
monitoring.server-info.server-name=监听代理服务器
#缺省[是否使用sigar采集服务器信息，默认：false]
monitoring.server-info.user-sigar-enable=false
#缺省[是否采集网络设备信息，默认false]
monitoring.network-device-info.enable=false
#缺省[与服务端或者代理端发送网络设备信息的频率（秒），默认300秒，最小不能小于300秒]
monitoring.network-device-info.rate=300
#缺省[采集网络设备信息snmp协议连接社区字符串，默认public]
monitoring.network-device-info.snmp-connection-communities=public,private,admin,manager,system,community
#缺省[是否采集Java虚拟机信息，默认false]
monitoring.jvm-info.enable=true
#缺省[与服务端或者代理端发送Java虚拟机信息的频率（秒），默认60秒，最小不能小于30秒]
monitoring.jvm-info.rate=60
#缺省[是否采集Java线程池信息，默认：false]
monitoring.java-thread-pool-info.enable=true
#缺省[与服务端或者代理端发送Java线程池信息的频率（秒），默认60秒，最小不能小于30秒]
monitoring.java-thread-pool-info.rate=60
#缺省[是否采集docker信息，默认false]
monitoring.docker-info.enable=false
#缺省[与服务端或者代理端发送docker信息的频率（秒），默认60秒，最小不能小于30秒]
monitoring.docker-info.rate=60
#缺省[被监控的docker主机，默认：tcp://localhost:2375]
monitoring.docker-info.host=unix:///var/run/docker.sock
#缺省[启用/禁用TLS验证，默认false]
monitoring.docker-info.tls-verify=
#缺省[验证所需证书的路径，默认：不填写]
monitoring.docker-info.cert-path=
#缺省[其他docker配置文件的路径，默认：不填写]
monitoring.docker-info.config=
#缺省[API版本，默认：不填写]
monitoring.docker-info.api-version=
#缺省[注册地址，默认：不填写]
monitoring.docker-info.registry-url=
#缺省[注册用户名，默认：不填写]
monitoring.docker-info.registry-username=
#缺省[注册密码，默认：不填写]
monitoring.docker-info.registry-password=
#缺省[注册电子邮箱，默认：不填写]
monitoring.docker-info.registry-email=
#缺省[是否开启arthas，默认false]
monitoring.arthas.enable=true