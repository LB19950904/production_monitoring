<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8">
    <title th:text="#{menu.instance}">应用程序</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="./layui/css/layui.css" th:href="@{/layui/css/layui.css}" media="all">
    <link rel="stylesheet" href="./style/admin.css" th:href="@{/style/admin.css}" media="all">
    <link rel="stylesheet" href="./style/myself.css" th:href="@{/style/myself.css}" media="all">
    <!-- 引入国际化工具 -->
    <script th:src="@{/js/i18n/i18n-config.js}"></script>
    <script th:src="@{/js/i18n/i18n-utils.js}"></script>
    <script th:src="@{/js/i18n/messages/zh_CN.js}"></script>
    <script th:src="@{/js/i18n/messages/en_US.js}"></script>
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
    <script src="./js/html5.min.js" th:src="@{/js/html5.min.js}"></script>
    <script src="./js/respond.min.js" th:src="@{/js/respond.min.js}"></script>
    <![endif]-->
    <script type="text/javascript" charset="utf-8" th:inline="javascript">
        var ctxPath = /*[[@{/}]]*/'';
        var authority = [[${#authorization.expression('hasAuthority("超级管理员")')}]];
    </script>
</head>
<body>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <form class="layui-form-item" onsubmit="return false;">
                <div class="layui-inline">
                    <label class="layui-form-label" for="instanceName" th:text="#{instance.instanceName}">应用名称</label>
                    <div class="layui-input-block">
                        <input type="text" id="instanceName" name="instanceName" th:placeholder="#{server.placeholder.search}" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="endpoint" th:text="#{instance.endpoint}">端点</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="endpoint" name="endpoint">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option value="client" th:text="#{instance.endpoint.client}">客户端</option>
                            <option value="agent" th:text="#{instance.endpoint.agent}">代理端</option>
                            <option value="server" th:text="#{instance.endpoint.server}">服务端</option>
                            <option value="ui" th:text="#{instance.endpoint.ui}">UI端</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="ip" th:text="#{server.ip}">IP</label>
                    <div class="layui-input-block">
                        <input type="text" id="ip" name="ip" th:placeholder="#{server.placeholder.search}" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="isOnline" th:text="#{instance.appStatus}">应用状态</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="isOnline" name="isOnline">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option value="1" th:text="#{server.online}">在线</option>
                            <option value="0" th:text="#{server.offline}">离线</option>
                            <option value="-1" th:text="#{server.unknown}">未知</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="appServerType" th:text="#{instance.appServerType}">应用服务器</label>
                    <div class="layui-input-block">
                        <input type="text" id="appServerType" name="appServerType" th:placeholder="#{server.placeholder.search}"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="language" th:text="#{instance.language}">程序语言</label>
                    <div class="layui-input-block">
                        <input type="text" id="language" name="language" th:placeholder="#{server.placeholder.search}"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="monitorEnv" th:text="#{env.name}">环境</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="monitorEnv" name="monitorEnv">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option th:each="monitorEnv:${monitorEnvs}" th:value="${monitorEnv}"
                                    th:text="${monitorEnv}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="monitorGroup" th:text="#{group.name}">分组</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="monitorGroup" name="monitorGroup">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option th:each="monitorGroup:${monitorGroups}" th:value="${monitorGroup}"
                                    th:text="${monitorGroup}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="instanceDesc" th:text="#{server.description}">描述</label>
                    <div class="layui-input-block">
                        <input type="text" id="instanceDesc" name="instanceDesc" th:placeholder="#{server.placeholder.search}" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="isEnableMonitor" th:text="#{database.isEnableMonitor}">是否监控</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="isEnableMonitor" name="isEnableMonitor">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option value="1" th:text="#{server.yes}">是</option>
                            <option value="0" th:text="#{server.no}">否</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="isEnableAlarm" th:text="#{database.isEnableAlarm}">是否告警</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="isEnableAlarm" name="isEnableAlarm">
                            <option value="" th:text="#{server.all}">所有</option>
                            <option value="1" th:text="#{server.yes}">是</option>
                            <option value="0" th:text="#{server.no}">否</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="list-table-search">
                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                    </button>
                    <button id="reset" type="reset" class="layui-btn" lay-filter="list-table-reset" lay-submit th:text="#{btn.reset}">清空
                    </button>
                </div>
            </form>
        </div>

        <div class="layui-card-body">
            <table id="list-table" lay-filter="list-table"></table>
            <script type="text/html" id="imgTpl">
                <img style="display: inline-block; width: 50%; height: 100%;" src={{ d.avatar }}>
            </script>
            <script type="text/html" id="isEnableMonitorTpl">
                <input type="checkbox" name="isEnableMonitor" value="{{ d.id }} | {{ d.instanceId }}" lay-skin="switch"
                       lay-text="是|否" lay-filter="isEnableMonitorFilter" {{ d.isEnableMonitor=='1'?'checked':'' }}
                       sec:authorize="hasAuthority('超级管理员')">
            </script>
            <script type="text/html" id="isEnableAlarmTpl">
                <input type="checkbox" name="isEnableAlarm" value="{{ d.id }} | {{ d.instanceId }}" lay-skin="switch"
                       lay-text="是|否" lay-filter="isEnableAlarmFilter" {{ d.isEnableAlarm=='1'?'checked':'' }}
                       sec:authorize="hasAuthority('超级管理员')">
            </script>
            <script type="text/html" id="list-table-toolbar">
                <div class="layui-btn-container" sec:authorize="hasAuthority('超级管理员')">
                    <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="batchdel">
                        <i class="layui-icon layui-icon-delete"></i><span th:text="#{btn.delete}">删除</span>
                    </button>
                </div>
            </script>
            <script type="text/html" id="list-table-toolbar-detail">
                <div class="layui-btn-group">
                    {{# if(d.isEnableArthas || d.isCollectVmMetrics || d.isCollectThreadPoolMetrics) { }}
                    <a class="layui-btn layui-btn-sm layui-btn-xs" lay-event="info">
                        <i class="layui-icon layui-icon-about"></i><span th:text="#{btn.detail}">详情</span></a>
                    {{# } }}
                    <a class="layui-btn layui-btn-normal layui-btn-xs"
                       lay-event="more" sec:authorize="hasAuthority('超级管理员')">
                        <i class="layui-icon layui-icon-down"></i><span th:text="#{btn.more}">更多</span>
                    </a>
                </div>
            </script>
        </div>
    </div>
</div>
<script src="./js/common.js" th:src="@{/js/common.js}" charset="utf-8"></script>
<script src="./layui/layui.js" th:src="@{/layui/layui.js}"></script>
<script charset="utf-8" th:inline="javascript">
    layui.config({
        base: ctxPath //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'admin', 'form', 'table', 'dropdown', 'layer'], function () {
        var $ = layui.$, admin = layui.admin, form = layui.form, layer = layui.layer,
            table = layui.table, dropdown = layui.dropdown, device = layui.device();
        // 初始化表格工具栏导出下拉菜单国际化
        I18nUtils.initTableExportDropdownI18n();
        // 列定义
        const allColumns = [
            [{
                type: 'checkbox',
                hide: !authority,
                fixed: (device.ios || device.android) ? false : 'left',
            }, {
                field: 'id',
                width: 70,
                title: 'ID',
                sort: !0,
                hide: true
            }, {
                field: 'instanceId',
                title: I18nUtils.t('instance.instanceId'),
                width: 180,
                sort: !0
            }, {
                field: 'instanceName',
                title: I18nUtils.t('instance.instanceName'),
                minWidth: 200,
                sort: !0
            }, {
                field: 'endpoint',
                title: I18nUtils.t('instance.endpoint'),
                minWidth: 100,
                sort: !0
            }, {
                field: 'ip',
                title: I18nUtils.t('instance.ip'),
                minWidth: 150,
                sort: !0
            }, {
                field: 'isOnline',
                title: I18nUtils.t('instance.status'),
                minWidth: 120,
                sort: !0
            }, {
                field: 'offlineCount',
                title: I18nUtils.t('instance.offlineCount'),
                minWidth: 110,
                sort: !0
            }, {
                field: 'appServerType',
                title: I18nUtils.t('instance.appServerType'),
                minWidth: 120,
                sort: !0
            }, {
                field: 'language',
                title: I18nUtils.t('instance.language'),
                minWidth: 120,
                sort: !0
            }, {
                field: 'finalHeartbeat',
                title: I18nUtils.t('instance.finalHeartbeat'),
                minWidth: 170,
                sort: !0
            }, {
                field: 'monitorEnv',
                title: I18nUtils.t('instance.monitorEnv'),
                minWidth: 120,
                sort: !0
            }, {
                field: 'monitorGroup',
                title: I18nUtils.t('instance.monitorGroup'),
                minWidth: 120,
                sort: !0
            }, {
                field: 'instanceDesc',
                title: I18nUtils.t('instance.description'),
                minWidth: 250,
                sort: !0
            }, {
                field: 'insertTime',
                title: I18nUtils.t('instance.insertTime'),
                minWidth: 170,
                sort: !0
            }, {
                field: 'isEnableMonitor',
                title: I18nUtils.t('instance.isEnableMonitor'),
                width: 90,
                templet: '#isEnableMonitorTpl',
                unresize: true,
                permission: authority
            }, {
                field: 'isEnableAlarm',
                title: I18nUtils.t('instance.isEnableAlarm'),
                width: 90,
                templet: '#isEnableAlarmTpl',
                unresize: true,
                permission: authority
            }, {
                title: I18nUtils.t('instance.actions'),
                width: authority ? 140 : 100,
                align: 'center',
                fixed: (device.ios || device.android) ? false : 'right',
                toolbar: '#list-table-toolbar-detail'
            }]
        ];
        table.render({
            elem: '#list-table',
            url: ctxPath + 'monitor-instance/get-monitor-instance-list',
            defaultToolbar: I18nUtils.getDefaultToolbar(),
            toolbar: '#list-table-toolbar',
            request: {
                pageName: 'current',//页码的参数名称，默认：page
                limitName: 'size' //每页数据量的参数名，默认：limit
            },
            response: {
                statusName: 'code', //规定数据状态的字段名称，默认：code
                statusCode: 200,//规定成功的状态码，默认：0
                msgName: 'msg',//规定状态信息的字段名称，默认：msg
                countName: 'count', //规定数据总数的字段名称，默认：count
                dataName: 'data' //规定数据列表的字段名称，默认：data
            },
            parseData: function (res) { //res 即为原始返回的数据
                return {
                    'code': res.code, //解析接口状态
                    'msg': res.msg, //解析提示文本
                    'count': res.data.total, //解析数据长度
                    'data': res.data.records //解析数据列表
                };
            },
            done: function () {
                // 翻译分页组件
                I18nUtils.translateLaypage();
                $('[data-field="isOnline"]').children().each(function () {
                    if ($(this).text() === '0') {
                        $(this).html('<span style="color: #FF4500;font-weight: bold;">' + I18nUtils.t('instance.statusOptions.offline') + '</span>');
                    }
                    if ($(this).text() === '1') {
                        $(this).text(I18nUtils.t('instance.statusOptions.online'));
                    }
                    if ($(this).text() === null || $(this).text() === '' || $(this).text() === undefined) {
                        $(this).text(I18nUtils.t('instance.statusOptions.unknown'));
                    }
                });
                $('[data-field="endpoint"]').children().each(function () {
                    if ($(this).text() === 'client') {
                        $(this).text(I18nUtils.t('instance.endpointOptions.client'));
                    }
                    if ($(this).text() === 'agent') {
                        $(this).text(I18nUtils.t('instance.endpointOptions.agent'));
                    }
                    if ($(this).text() === 'server') {
                        $(this).text(I18nUtils.t('instance.endpointOptions.server'));
                    }
                    if ($(this).text() === 'ui') {
                        $(this).text(I18nUtils.t('instance.endpointOptions.ui'));
                    }
                });
            },
            // 如果没有 permission 属性或者 permission 不是 false，则保留该列
            cols: allColumns.map(columnsGroup => columnsGroup.filter(col => !('permission' in col) || col.permission !== false)),
            page: !0,
            limit: 15,
            limits: [10, 15, 20, 30, 40, 50, 60, 70, 80, 90, 100],
            height: 'full-220'
        });
        // 监听搜索
        form.on('submit(list-table-search)', function (data) {
            var field = data.field;
            //执行重载
            table.reload('list-table', {
                where: field
            });
        });
        // 监听重置
        form.on('submit(list-table-reset)', function (data) {
            var field = data.field;
            // 清空所有字段的值
            field = clearFields(field);
            //执行重载
            table.reload('list-table', {
                where: field
            });
        });
        // 点击表头排序
        table.on('sort(list-table)', function (obj) {
            table.reload('list-table', {
                initSort: obj
            });
        });
        // 头工具栏事件
        table.on('toolbar(list-table)', function (obj) {
            switch (obj.event) {
                case 'batchdel':
                    var checkStatus = table.checkStatus('list-table'), checkData = checkStatus.data; //得到选中的数据
                    if (checkData.length === 0) {
                        return layer.msg(I18nUtils.t('instance.msg.selectData'));
                    }
                    layer.confirm(I18nUtils.t('instance.msg.confirmDelete'), function (index) {
                        var loading = layer.load(1, {
                            shade: [0.1, '#fff'] //0.1透明度的白色背景
                        });
                        admin.req({
                            type: 'delete',
                            url: ctxPath + 'monitor-instance/delete-monitor-instance',
                            data: JSON.stringify(checkData.map(({id, instanceId}) => ({id, instanceId}))),
                            dataType: 'json',
                            contentType: 'application/json;charset=utf-8',
                            headers: {
                                [[${_csrf.headerName}]]: [[${_csrf.token}]]
                            },
                            success: function (result) {
                                var data = result.data;
                                if (data === webConst.SUCCESS) {
                                    table.reload('list-table'); //数据刷新
                                    layer.msg(I18nUtils.t('instance.msg.deleteSuccess'), {icon: 6});
                                } else {
                                    layer.msg(I18nUtils.t('instance.msg.deleteFailed'), {icon: 5, shift: 6});
                                }
                                layer.close(loading);
                            },
                            error: function () {
                                layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                                layer.close(loading);
                            },
                            complete: function () {
                                layer.close(loading);
                            }
                        });
                    });
                    break;
            }
        });
        // 监听工具条
        table.on('tool(list-table)', function (obj) {
            var that = this;
            var data = obj.data;
            if (obj.event === 'info') {
                // 宽度
                var width;
                // 高度
                var height;
                // 移动端
                if (device.ios || device.android) {
                    // 宽度
                    width = document.body.clientWidth * 0.8 + 'px';
                    // 高度
                    height = document.body.clientHeight * 0.55 + 'px';
                } else {
                    // 宽度
                    width = document.body.clientWidth * 0.8 + 'px';
                    // 高度
                    height = document.body.clientHeight * 0.8 + 'px';
                }
                var infoLayerIndex = layer.open({
                    type: 2,
                    title: I18nUtils.t('instance.dialog.detail', {instanceId: data.instanceId}),
                    content: ctxPath + 'monitor-instance/instance-detail?id=' + data.id + '&instanceId=' + data.instanceId,
                    maxmin: true,
                    shade: 0,
                    moveOut: true,
                    area: [width, height],
                    success: function (layero, index) {
                        // 在回调方法中的第2个参数“index”表示的是当前弹窗的索引
                        // 通过layer.full方法将窗口放大
                        // layer.full(index);
                        // 关键：给 iframe 添加 allow="fullscreen"
                        var iframe = layero.find('iframe');
                        iframe.attr('allow', 'fullscreen');
                    }
                });
                layer.full(infoLayerIndex);
            } else if (obj.event === 'more') {
                // 更多下拉菜单
                dropdown.render({
                    elem: that,
                    show: true, //外部事件触发即显示
                    align: 'right',  //右对齐弹出（v2.6.8 新增）
                    style: 'box-shadow: 1px 1px 10px rgb(0 0 0 / 12%);', //设置额外样式
                    data: [{
                        title: I18nUtils.t('instance.menu.edit'),
                        id: 'edit'
                    }, {
                        title: I18nUtils.t('instance.menu.delete'),
                        id: 'del'
                    }, {
                        title: I18nUtils.t('instance.menu.clear'),
                        id: 'clear'
                    }],
                    click: function (object) {
                        if (object.id === 'edit') {
                            // 宽度
                            var width;
                            // 高度
                            var height;
                            // 移动端
                            if (device.ios || device.android) {
                                // 宽度
                                width = document.body.clientWidth * 0.68 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.45 + 'px';
                            } else {
                                // 宽度
                                width = document.body.clientWidth * 0.3 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.54 + 'px';
                            }
                            var infoLayerEditIndex = layer.open({
                                type: 2,
                                title: I18nUtils.t('instance.dialog.editDesc'),
                                content: ctxPath + 'monitor-instance/edit-monitor-instance-form?instanceId=' + data.instanceId,
                                maxmin: true,
                                area: [width, height],
                                btn: [I18nUtils.t('common.confirm'), I18nUtils.t('common.cancel')],
                                yes: function (index, layero) {
                                    var iframeWindow = window['layui-layer-iframe' + index],
                                        submitID = 'LAY-front-submit',
                                        submit = layero.find('iframe').contents().find('#' + submitID);
                                    //监听提交
                                    iframeWindow.layui.form.on('submit(' + submitID + ')', function (data) {
                                        var field = data.field; //获取提交的字段
                                        var loading = layer.load(1, {
                                            shade: [0.1, '#fff'] //0.1透明度的白色背景
                                        });
                                        admin.req({
                                            type: 'put',
                                            url: ctxPath + 'monitor-instance/edit-monitor-instance',
                                            data: field,
                                            dataType: 'json',
                                            headers: {
                                                [[${_csrf.headerName}]]: [[${_csrf.token}]]
                                            },
                                            success: function (result) {
                                                var data = result.data;
                                                if (data === webConst.SUCCESS) {
                                                    table.reload('list-table'); //数据刷新
                                                    layer.close(index); //关闭弹层
                                                    layer.msg(I18nUtils.t('instance.msg.editSuccess'), {icon: 6});
                                                } else {
                                                    layer.msg(I18nUtils.t('instance.msg.editFailed'), {icon: 5, shift: 6});
                                                }
                                                layer.close(loading);
                                            },
                                            error: function () {
                                                layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                                                layer.close(loading);
                                            }
                                        });
                                    });
                                    submit.trigger('click');
                                }
                            });
                            if (device.ios || device.android) {
                                layer.full(infoLayerEditIndex);
                            }
                        }
                        if (object.id === 'del') {
                            layer.confirm(I18nUtils.t('instance.msg.confirmDelete'), function (index) {
                                var loading = layer.load(1, {
                                    shade: [0.1, '#fff'] //0.1透明度的白色背景
                                });
                                admin.req({
                                    type: 'delete',
                                    url: ctxPath + 'monitor-instance/delete-monitor-instance',
                                    data: JSON.stringify([{id: data.id, instanceId: data.instanceId}]),
                                    dataType: 'json',
                                    contentType: 'application/json;charset=utf-8',
                                    headers: {
                                        [[${_csrf.headerName}]]: [[${_csrf.token}]]
                                    },
                                    success: function (result) {
                                        var data = result.data;
                                        if (data === webConst.SUCCESS) {
                                            obj.del();
                                            table.reload('list-table'); //数据刷新
                                            layer.msg(I18nUtils.t('instance.msg.deleteSuccess'), {icon: 6});
                                        } else {
                                            layer.msg(I18nUtils.t('instance.msg.deleteFailed'), {icon: 5, shift: 6});
                                        }
                                        layer.close(loading);
                                    },
                                    error: function () {
                                        layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                                        layer.close(loading);
                                    },
                                    complete: function () {
                                        layer.close(loading);
                                    }
                                });
                            });
                        }
                        if (object.id === 'clear') {
                            // 宽度
                            var width;
                            // 高度
                            var height;
                            // 移动端
                            if (device.ios || device.android) {
                                // 宽度
                                width = document.body.clientWidth * 0.68 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.4 + 'px';
                            } else {
                                // 宽度
                                width = document.body.clientWidth * 0.25 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.45 + 'px';
                            }
                            var infoLayerClearIndex = layer.open({
                                type: 2,
                                title: I18nUtils.t('instance.dialog.clearData'),
                                content: ctxPath + 'monitor-instance/instance-clear?instanceId=' + data.instanceId,
                                maxmin: true,
                                area: [width, height],
                                btn: [I18nUtils.t('common.confirm'), I18nUtils.t('common.cancel')],
                                yes: function (index, layero) {
                                    var iframeWindow = window['layui-layer-iframe' + index],
                                        submitID = 'LAY-front-submit',
                                        submit = layero.find('iframe').contents().find('#' + submitID);
                                    //监听提交
                                    iframeWindow.layui.form.on('submit(' + submitID + ')', function (data) {
                                        var field = data.field; //获取提交的字段
                                        var loading = layer.load(1, {
                                            shade: [0.1, '#fff'] //0.1透明度的白色背景
                                        });
                                        admin.req({
                                            type: 'delete',
                                            url: ctxPath + 'monitor-instance/clear-monitor-instance-history',
                                            data: field,
                                            dataType: 'json',
                                            headers: {
                                                [[${_csrf.headerName}]]: [[${_csrf.token}]]
                                            },
                                            success: function (result) {
                                                var data = result.data;
                                                if (data === webConst.SUCCESS) {
                                                    layer.close(index); //关闭弹层
                                                    layer.msg(I18nUtils.t('instance.msg.clearSuccess'), {icon: 6});
                                                } else if (data === webConst.REQUIRED_IS_NULL) {
                                                    layer.msg(I18nUtils.t('instance.msg.requiredNull'), {icon: 5, shift: 6});
                                                } else {
                                                    layer.msg(I18nUtils.t('instance.msg.clearFailed'), {icon: 5, shift: 6});
                                                }
                                                layer.close(loading);
                                            },
                                            error: function () {
                                                layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                                                layer.close(loading);
                                            },
                                            complete: function () {
                                                layer.close(loading);
                                            }
                                        });
                                    });
                                    submit.trigger('click');
                                }
                            });
                            if (device.ios || device.android) {
                                layer.full(infoLayerClearIndex);
                            }
                        }
                    }
                });
            }
        });
        // 是否监控操作
        form.on('switch(isEnableMonitorFilter)', function (obj) {
            var idAndInstanceId = this.value.split('|');
            var id = idAndInstanceId[0].trim();
            var instanceId = idAndInstanceId[1].trim();
            admin.req({
                type: 'put',
                url: ctxPath + 'monitor-instance/set-is-enable-monitor',
                data: {
                    id: id,
                    instanceId: instanceId,
                    isEnableMonitor: (obj.elem.checked ? '1' : '0')
                },
                dataType: 'json',
                headers: {
                    [[${_csrf.headerName}]]: [[${_csrf.token}]]
                },
                success: function (result) {
                    var data = result.data;
                    if (data === webConst.SUCCESS) {
                        // table.reload('list-table'); //数据刷新
                        layer.msg(I18nUtils.t('instance.msg.setSuccess'), {icon: 6});
                    } else {
                        layer.msg(I18nUtils.t('instance.msg.setFailed'), {icon: 5, shift: 6});
                    }
                },
                error: function () {
                    layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                }
            });
        });
        // 是否告警操作
        form.on('switch(isEnableAlarmFilter)', function (obj) {
            var idAndInstanceId = this.value.split('|');
            var id = idAndInstanceId[0].trim();
            var instanceId = idAndInstanceId[1].trim();
            admin.req({
                type: 'put',
                url: ctxPath + 'monitor-instance/set-is-enable-alarm',
                data: {
                    id: id,
                    instanceId: instanceId,
                    isEnableAlarm: (obj.elem.checked ? '1' : '0')
                },
                dataType: 'json',
                headers: {
                    [[${_csrf.headerName}]]: [[${_csrf.token}]]
                },
                success: function (result) {
                    var data = result.data;
                    if (data === webConst.SUCCESS) {
                        // table.reload('list-table'); //数据刷新
                        layer.msg(I18nUtils.t('instance.msg.setSuccess'), {icon: 6});
                    } else {
                        layer.msg(I18nUtils.t('instance.msg.setFailed'), {icon: 5, shift: 6});
                    }
                },
                error: function () {
                    layer.msg(I18nUtils.t('instance.msg.systemError'), {icon: 5, shift: 6});
                }
            });
        });
    });
</script>
</body>
</html>
