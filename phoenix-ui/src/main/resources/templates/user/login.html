<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="#{common.projectName} + ' - ' + #{login.title}">生产通讯保障系统 - 登录</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="icon" th:href="@{/favicon16.png}" type="image/png" sizes="16x16">
    <link rel="icon" th:href="@{/favicon32.png}" type="image/png" sizes="32x32">
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml" sizes="128x128">
    <link rel="alternate icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/vnd.microsoft.icon">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}" type="image/png" sizes="128x128">
    <link rel="bookmark" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="dns-prefetch" th:href="@{/favicon32.png}" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="./layui/css/layui.css" th:href="@{/layui/css/layui.css}" media="all">
    <link rel="stylesheet" href="./style/login.css" th:href="@{/style/login.css}" media="all">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
    <script th:src="@{/js/html5.min.js}"></script>
    <script th:src="@{/js/respond.min.js}"></script>
    <![endif]-->
    <style>
        .layadmin-user-login {
            width: 100%;
            background-image: url("/images/new-ui/登录页背景图.png");
            background-size: cover;
            background-repeat: no-repeat;
            padding: 0;
            margin: 0;
        }
        .layadmin-user-login-main {
            width: 540px;
            height: 642px;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 270px;
            right: 210px;
        }
        .layui-input, .layui-select, .layui-textarea {
            background: #FFFFFF;
            border-radius: 8px;
            border: 1px solid #D7D7D7;
            height: 58px;
        }
        .myself-user-id-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            position: absolute;
            left: 8px;
            top: 14px;
            background-image: url("/images/new-ui/登录ID.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .myself-user-password-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            position: absolute;
            left: 8px;
            top: 14px;
            background-image: url("/images/new-ui/password.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .myself-user-captcha-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            position: absolute;
            left: 8px;
            top: 14px;
            background-image: url("/images/new-ui/v_password.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .myself-user-language-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            position: absolute;
            left: 8px;
            top: 14px;
            background-image: url("/images/new-ui/语言.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .layadmin-user-login-codeimg {
            max-height: 58px;
        }
        .layui-form-select {
            position: static;
        }
        .my-layui-btn {
            height: 60px;
            font-size: 20px;
            background-color: #337EFF;
        }
        .layadmin-user-login-body .layui-form-checkbox.layui-form-checked i{
            border-color: #337EFF !important;
            background-color: #337EFF !important;
        }
        .system-login-name {
            width: 312px;
            height: 48px;
            margin: 0 auto;
            font-weight: bold;
            font-size: 36px;
            color: #333333;
            line-height: 40px;
            letter-spacing: 3px;
            text-align: center;
            font-style: normal;
        }
    </style>
</head>
<body>
<div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login">
    <div class="layadmin-user-login-main">
        <form class="layadmin-user-login-box layadmin-user-login-body layui-form" th:action="@{/doLogin}" method="post">
            <div class="layui-form-item">
                <div class="system-login-name" th:text="#{common.projectName}"></div>
            </div>
            <div class="layui-form-item">
                <label class="myself-user-language-icon"
                       for="LAY-user-login-language"></label>
                <select name="language" id="LAY-user-login-language" lay-filter="LAY-user-login-language" placeholder="语言"
                        lay-verify="language" th:placeholder="#{login.placeholder.language}">
                    <option value="简体中文">简体中文</option>
                    <option value="English">English</option>
                </select>
            </div>
            <div class="layui-form-item">
                <label class="myself-user-id-icon" for="LAY-user-login-username"></label>
                <input type="text" name="account" id="LAY-user-login-username" lay-verify="account"
                       th:placeholder="#{login.placeholder.account}" placeholder="账号"
                       class="layui-input" autocomplete="on" lay-verType="tips">
            </div>
            <div class="layui-form-item">
                <label class="myself-user-password-icon"
                       for="LAY-user-login-password"></label>
                <input type="password" name="password" id="LAY-user-login-password" lay-verify="password"
                       th:placeholder="#{login.placeholder.password}" placeholder="密码" class="layui-input" lay-verType="tips">
            </div>
            <div class="layui-form-item" th:if="${enableLoginCaptcha}">
                <div class="layui-row">
                    <div class="layui-col-xs7">
                        <label class="myself-user-captcha-icon"
                               for="LAY-user-login-vercode"></label>
                        <input type="text" name="captcha" id="LAY-user-login-vercode" lay-verify="captcha"
                               th:placeholder="#{login.placeholder.captcha}" placeholder="图形验证码" class="layui-input" lay-verType="tips">
                    </div>
                    <div class="layui-col-xs5">
                        <div style="margin-left: 10px;height: 58px;">
                            <img th:src="@{/captcha.png}" class="layadmin-user-login-codeimg"
                                 id="LAY-user-get-vercode" th:alt="#{login.captcha}" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" th:if="${param.error}">
                <label style="color: red;" th:text="#{login.error.account.error}">
                    账号或密码错误，请重新输入！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.expire}">
                <label style="color: red;" th:text="#{login.error.expire}">
                    此账号已被管理员修改，您被迫下线！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.timeout}">
                <label style="color: red;" th:text="#{login.error.timeout}">
                    登录已超时，请重新登录！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.captchaCannotBeEmpty}">
                <label style="color: red;" th:text="#{login.error.captcha.empty}">
                    图形验证码不能为空！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.captchaDoesNotExist}">
                <label style="color: red;" th:text="#{login.error.captcha.notexist}">
                    图形验证码不存在！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.captchaHasExpired}">
                <label style="color: red;" th:text="#{login.error.captcha.expired}">
                    图形验证码已过期！
                </label>
            </div>
            <div class="layui-form-item" th:if="${param.captchaVerificationFailed}">
                <label style="color: red;" th:text="#{login.error.captcha.failed}">
                    图形验证码校验失败！
                </label>
            </div>
            <div class="layui-form-item" style="margin-bottom: 20px;">
                <input class="myself-checkbox-checked" type="checkbox" name="remember-me" lay-skin="primary" th:title="#{login.remember}" title="记住我">
            </div>
            <div class="layui-form-item">
                <button type="submit" class="layui-btn layui-btn-fluid my-layui-btn" lay-submit th:text="#{login.submit}">登 录</button>
            </div>
        </form>
    </div>
    <!--<div class="layui-trans layadmin-user-login-footer">
        <p th:text="#{login.footer.copyright}">Copyright 2020-2025 by PIFENG</p>
        <p>
            <span>
                <a href='https://gitee.com/monitoring-platform/phoenix' target="_blank">
                Fork me on Gitee
                </a>
            </span>
        </p>
    </div>-->

</div>
<script th:src="@{/layui/layui.js}" charset="utf-8"></script>
<script th:src="@{/js/i18n/messages/zh_CN.js}" charset="utf-8"></script>
<script th:src="@{/js/i18n/messages/en_US.js}" charset="utf-8"></script>
<script th:src="@{/js/i18n/i18n-config.js}" charset="utf-8"></script>
<script th:src="@{/js/i18n/i18n-utils.js}" charset="utf-8"></script>
<script th:inline="javascript" charset="utf-8">
    var ctxPath = /*[[@{/}]]*/'';
    // 是否启用登录验证码
    var enableLoginCaptcha = [[${enableLoginCaptcha}]];

    // 确保在页面加载完成后初始化国际化
    (function() {
        // 立即初始化国际化配置
        I18nConfig.init();
        console.log('I18n initialized:', I18nConfig.getCurrentLocale());
        console.log('Messages loaded:', JSON.stringify(I18nConfig.messages).substring(0, 100) + '...');
    })();

    layui.use(['form', 'jquery'], function () {
        var form = layui.form, $ = layui.$;

        // 自定义验证规则（使用国际化消息）
        form.verify({
            account: function (value) {
                if (value.length === 0) {
                    console.log('Account validation, current locale:', I18nConfig.getCurrentLocale());
                    var msg = I18nUtils.t('login.error.account.empty');
                    console.log('Account validation message:', msg);
                    return msg;
                }
            },
            password: function (value) {
                if (value.length === 0) {
                    console.log('Password validation, current locale:', I18nConfig.getCurrentLocale());
                    var msg = I18nUtils.t('login.error.password.empty');
                    console.log('Password validation message:', msg);
                    return msg;
                }
            },
            captcha: function (value) {
                if (enableLoginCaptcha === true && value.length === 0) {
                    console.log('Captcha validation, current locale:', I18nConfig.getCurrentLocale());
                    var msg = I18nUtils.t('login.error.captcha.required');
                    console.log('Captcha validation message:', msg);
                    return msg;
                }
            }
        });

        // 点击图片刷新
        $('#LAY-user-get-vercode').click(function (_this) {
            $('#LAY-user-get-vercode').attr('src', ctxPath + 'captcha.png?t=' + Math.random());
        });

        if (enableLoginCaptcha === true) {
            // 验证码每分钟自动刷新
            window.setInterval(function () {
                $('#LAY-user-get-vercode').attr('src', ctxPath + 'captcha.png?t=' + Math.random());
            }, 1000 * 60);
        }

        // 语言下拉框切换
        var currentLocale = I18nConfig.getCurrentLocale();
        var langSelect = $('#LAY-user-login-language');
        // 设置默认选中项
        if (currentLocale === 'en_US') {
            langSelect.val('English');
        } else {
            langSelect.val('简体中文');
        }
        form.render('select');
        // 监听语言切换
        form.on('select(LAY-user-login-language)', function (data) {
            if (data.value === 'English') {
                I18nUtils.switchToEnglish();
            } else {
                I18nUtils.switchToChinese();
            }
        });
    });
</script>
</body>
</html>
