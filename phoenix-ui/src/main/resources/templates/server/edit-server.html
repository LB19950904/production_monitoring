<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="#{page.editServer}">编辑服务器信息</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="./layui/css/layui.css" th:href="@{/layui/css/layui.css}" media="all">
    <link rel="stylesheet" href="./style/myself.css" th:href="@{/style/myself.css}" media="all">
    <!-- 引入国际化工具 -->
    <script th:src="@{/js/i18n/i18n-config.js}"></script>
    <script th:src="@{/js/i18n/i18n-utils.js}"></script>
    <script th:src="@{/js/i18n/messages/zh_CN.js}"></script>
    <script th:src="@{/js/i18n/messages/en_US.js}"></script>
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
    <script src="./js/html5.min.js" th:src="@{/js/html5.min.js}"></script>
    <script src="./js/respond.min.js" th:src="@{/js/respond.min.js}"></script>
    <![endif]-->
    <script type="text/javascript" charset="utf-8" th:inline="javascript">
        var ctxPath = /*[[@{/}]]*/'';
    </script>
</head>
<body>
<div class="layui-form" lay-filter="layuiadmin-form-useradmin" id="layuiadmin-form-useradmin"
     style="padding: 20px 20px 0 0;">
    <div class="layui-form-item" style="display: none">
        <label class="layui-form-label" for="id" th:text="#{form.id}">ID</label>
        <div class="layui-input-inline">
            <input type="hidden" id="id" name="id" class="layui-input" th:value="${id}" readonly>
        </div>
        <label class="layui-form-label" for="ip" th:text="#{server.ip}">IP</label>
        <div class="layui-input-inline">
            <input type="hidden" id="ip" name="ip" class="layui-input" th:value="${ip}" readonly>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label" for="monitorEnv" th:text="#{env.name}">环境</label>
        <div class="layui-input-block">
            <select id="monitorEnv" name="monitorEnv">
                <option value="" th:text="#{server.notSet}">不设置</option>
                <option th:each="monitorEnv:${monitorEnvs}" th:value="${monitorEnv}"
                        th:text="${monitorEnv}" th:selected="${monitorEnv==env}"></option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label" for="monitorGroup" th:text="#{group.name}">分组</label>
        <div class="layui-input-block">
            <select id="monitorGroup" name="monitorGroup">
                <option value="" th:text="#{server.notSet}">不设置</option>
                <option th:each="monitorGroup:${monitorGroups}" th:value="${monitorGroup}"
                        th:text="${monitorGroup}" th:selected="${monitorGroup==group}"></option>
            </select>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label" for="isEnableMonitor" th:text="#{database.isEnableMonitor}">是否监控</label>
        <div class="layui-input-inline">
            <input type="checkbox" name="isEnableMonitor" lay-text="是|否"
                   id="isEnableMonitor" value="1" lay-skin="switch"
                   th:checked="${isEnableMonitor=='1'}? true : false">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label" for="isEnableAlarm" th:text="#{database.isEnableAlarm}">是否告警</label>
        <div class="layui-input-inline">
            <input type="checkbox" name="isEnableAlarm" lay-text="是|否"
                   id="isEnableAlarm" value="1" lay-skin="switch"
                   th:checked="${isEnableAlarm=='1'}? true : false">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label" for="serverSummary" th:text="#{server.description}">描述</label>
        <div class="layui-input-block">
            <textarea id="serverSummary" name="serverSummary" th:text="${serverSummary}" class="layui-textarea"
                      th:placeholder="#{server.placeholder.description}" autocomplete="off" maxlength="500"></textarea>
        </div>
    </div>
    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="LAY-front-submit" id="LAY-front-submit" th:value="#{form.confirm}" value="确认">
    </div>
</div>
<script src="./layui/layui.js" th:src="@{/layui/layui.js}"></script>
<script charset="utf-8" th:inline="javascript">
    layui.config({
        base: ctxPath //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form'], function() {
        var form = layui.form;
        // 自定义验证规则
        form.verify({
            required: function(value) {
                if(value.length == 0){
                    return '此字段为必填项';
                }
            }
        });
    });
</script>
</body>
</html>
