<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8">
    <title>docker容器</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="./layui/css/layui.css" th:href="@{/layui/css/layui.css}" media="all">
    <link rel="stylesheet" href="./style/admin.css" th:href="@{/style/admin.css}" media="all">
    <link rel="stylesheet" href="./style/myself.css" th:href="@{/style/myself.css}" media="all">
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
    <script th:src="@{/js/html5.min.js}"></script>
    <script th:src="@{/js/respond.min.js}"></script>
    <![endif]-->
    <script type="text/javascript" charset="utf-8" th:inline="javascript">
        var ctxPath = /*[[@{/}]]*/'';
        var authority = [[${#authorization.expression('hasAuthority("超级管理员")')}]];
    </script>
</head>
<body>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <form class="layui-form-item" onsubmit="return false;">
                <div class="layui-inline">
                    <label class="layui-form-label" for="serverIp">服务器IP</label>
                    <div class="layui-input-block">
                        <input type="text" id="serverIp" name="serverIp" placeholder="请输入" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="containerName">容器名</label>
                    <div class="layui-input-block">
                        <input type="text" id="containerName" name="containerName" placeholder="请输入"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="imageName">镜像仓库</label>
                    <div class="layui-input-block">
                        <input type="text" id="imageName" name="imageName" placeholder="请输入" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>
                <br>
                <div class="layui-inline">
                    <label class="layui-form-label" for="status">状态</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="status" name="status">
                            <option value="">所有</option>
                            <option value="run">运行</option>
                            <option value="notRun">未运行</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="monitorEnv">环境</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="monitorEnv" name="monitorEnv">
                            <option value="">所有</option>
                            <option th:each="monitorEnv:${monitorEnvs}" th:value="${monitorEnv}"
                                    th:text="${monitorEnv}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" for="monitorGroup">分组</label>
                    <div class="layui-input-block" style="width: 182px;">
                        <select id="monitorGroup" name="monitorGroup">
                            <option value="">所有</option>
                            <option th:each="monitorGroup:${monitorGroups}" th:value="${monitorGroup}"
                                    th:text="${monitorGroup}"></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn layuiadmin-btn-useradmin" lay-submit lay-filter="list-table-search">
                        <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>
                    </button>
                    <button id="reset" type="reset" class="layui-btn" lay-filter="list-table-reset" lay-submit>清空
                    </button>
                </div>
            </form>
        </div>

        <div class="layui-card-body">
            <table id="list-table" lay-filter="list-table"></table>
            <script type="text/html" id="imgTpl">
                <img style="display: inline-block; width: 50%; height: 100%;" src={{ d.avatar }}>
            </script>
            <script type="text/html" id="list-table-toolbar">
                <div class="layui-btn-container" sec:authorize="hasAuthority('超级管理员')">
                    <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="batchdel">
                        <i class="layui-icon layui-icon-delete"></i>删除
                    </button>
                </div>
            </script>
            <script type="text/html" id="list-table-toolbar-detail">
                <div class="layui-btn-group">
                    <a class="layui-btn layui-btn-sm layui-btn-xs" lay-event="info">
                        <i class="layui-icon layui-icon-about"></i>详情</a>
                    <a class="layui-btn layui-btn-normal layui-btn-xs"
                       lay-event="more" sec:authorize="hasAuthority('超级管理员')">
                        <i class="layui-icon layui-icon-down"></i>更多
                    </a>
                </div>
            </script>
        </div>
    </div>
</div>
<script th:src="@{/js/common.js}" charset="utf-8"></script>
<script th:src="@{/layui/layui.js}"></script>
<script charset="utf-8" th:inline="javascript">
    layui.config({
        base: ctxPath //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'table', 'layer', 'dropdown'], function () {
        var $ = layui.$, layer = layui.layer, admin = layui.admin, form = layui.form,
            table = layui.table, dropdown = layui.dropdown, device = layui.device();
        table.render({
            elem: '#list-table',
            url: ctxPath + 'monitor-docker-container/get-monitor-docker-container-list',
            toolbar: '#list-table-toolbar',
            request: {
                pageName: 'current',//页码的参数名称，默认：page
                limitName: 'size' //每页数据量的参数名，默认：limit
            },
            response: {
                statusName: 'code', //规定数据状态的字段名称，默认：code
                statusCode: 200,//规定成功的状态码，默认：0
                msgName: 'msg',//规定状态信息的字段名称，默认：msg
                countName: 'count', //规定数据总数的字段名称，默认：count
                dataName: 'data' //规定数据列表的字段名称，默认：data
            },
            parseData: function (res) { //res 即为原始返回的数据
                return {
                    'code': res.code, //解析接口状态
                    'msg': res.msg, //解析提示文本
                    'count': res.data.total, //解析数据长度
                    'data': res.data.records //解析数据列表
                };
            },
            done: function (res) {
                $('[data-field="containerId"]').children().each(function () {
                    $(this).text($(this).text().substring(0, 12));
                });
                $('[data-field="imageId"]').children().each(function () {
                    $(this).text($(this).text().substring(0, 12));
                });
                for (var i in res.data) {		//遍历整个表格数据
                    var item = res.data[i];		//获取当前行数据
                    // docker服务离线
                    if (item.isOnline === '0') {
                        $('tr[data-index=' + i + ']').css('color', '#FF4500');
                    }
                }
            },
            cols: [
                [{
                    type: 'checkbox',
                    hide: !authority,
                    fixed: (device.ios || device.android) ? false : 'left',
                }, {
                    field: 'serverIp',
                    title: '服务器IP',
                    minWidth: 140,
                    sort: !0
                }, {
                    field: 'containerId',
                    title: '容器ID',
                    minWidth: 150,
                    sort: !0
                }, {
                    field: 'containerName',
                    title: '容器名',
                    minWidth: 150,
                    sort: !0
                }, {
                    field: 'containerPorts',
                    title: '容器端口',
                    minWidth: 120,
                    sort: !0
                }, {
                    field: 'command',
                    title: '命令',
                    minWidth: 200,
                    sort: !0
                }, {
                    field: 'status',
                    title: '容器状态',
                    minWidth: 150,
                    sort: !0
                }, {
                    field: 'imageId',
                    title: '镜像ID',
                    minWidth: 150,
                    sort: !0
                }, {
                    field: 'imageName',
                    title: '镜像仓库',
                    minWidth: 150,
                    sort: !0
                }, {
                    field: 'created',
                    title: '创建时间',
                    minWidth: 170,
                    sort: !0
                }, {
                    field: 'monitorEnv',
                    title: '环境',
                    minWidth: 120,
                    sort: !0
                }, {
                    field: 'monitorGroup',
                    title: '分组',
                    minWidth: 120,
                    sort: !0
                }, {
                    field: 'dockerSummary',
                    title: '描述',
                    minWidth: 250,
                    sort: !0
                }, {
                    field: 'insertTime',
                    title: '新增时间',
                    minWidth: 170,
                    sort: !0
                }, {
                    field: 'updateTime',
                    title: '更新时间',
                    minWidth: 170,
                    sort: !0
                }, {
                    title: '操作',
                    width: authority ? 140 : 100,
                    align: 'center',
                    fixed: (device.ios || device.android) ? false : 'right',
                    toolbar: '#list-table-toolbar-detail'
                }]
            ],
            page: !0,
            limit: 15,
            limits: [10, 15, 20, 30, 40, 50, 60, 70, 80, 90, 100],
            height: 'full-180'
        });
        //监听搜索
        form.on('submit(list-table-search)', function (data) {
            var field = data.field;
            //执行重载
            table.reload('list-table', {
                where: field
            });
        });
        // 监听重置
        form.on('submit(list-table-reset)', function (data) {
            var field = data.field;
            // 清空所有字段的值
            field = clearFields(field);
            //执行重载
            table.reload('list-table', {
                where: field
            });
        });
        // 点击表头排序
        table.on('sort(list-table)', function (obj) {
            table.reload('list-table', {
                initSort: obj
            });
        });
        //头工具栏事件
        table.on('toolbar(list-table)', function (obj) {
            switch (obj.event) {
                case 'batchdel':
                    var checkStatus = table.checkStatus('list-table'), checkData = checkStatus.data; //得到选中的数据
                    if (checkData.length === 0) {
                        return layer.msg('请选择数据');
                    }
                    layer.confirm('确定删除吗？', function (index) {
                        var loading = layer.load(1, {
                            shade: [0.1, '#fff'] //0.1透明度的白色背景
                        });
                        admin.req({
                            type: 'delete',
                            url: ctxPath + 'monitor-docker-container/delete-monitor-docker-container',
                            data: JSON.stringify(checkData.map(({serverIp, containerName}) => ({
                                serverIp,
                                containerName
                            }))),
                            dataType: 'json',
                            contentType: 'application/json;charset=utf-8',
                            headers: {
                                [[${_csrf.headerName}]]: [[${_csrf.token}]]
                            },
                            success: function (result) {
                                var data = result.data;
                                if (data === webConst.SUCCESS) {
                                    table.reload('list-table'); //数据刷新
                                    layer.msg('删除成功！', {icon: 6});
                                } else {
                                    layer.msg('删除失败！', {icon: 5, shift: 6});
                                }
                                layer.close(loading);
                            },
                            error: function () {
                                layer.msg('系统错误！', {icon: 5, shift: 6});
                                layer.close(loading);
                            },
                            complete: function () {
                                layer.close(loading);
                            }
                        });
                    });
                    break;
            }
        });
        //监听工具条
        table.on('tool(list-table)', function (obj) {
            var that = this;
            var data = obj.data;
            if (obj.event === 'info') {
                // 宽度
                var width;
                // 高度
                var height;
                // 移动端
                if (device.ios || device.android) {
                    // 宽度
                    width = document.body.clientWidth * 0.8 + 'px';
                    // 高度
                    height = document.body.clientHeight * 0.55 + 'px';
                } else {
                    // 宽度
                    width = document.body.clientWidth * 0.8 + 'px';
                    // 高度
                    height = document.body.clientHeight * 0.8 + 'px';
                }
                var infoLayerIndex = layer.open({
                    type: 2,
                    title: 'docker容器详情',
                    content: ctxPath + 'monitor-docker-container/docker-container-detail?serverIp=' + data.serverIp + '&containerName=' + data.containerName,
                    maxmin: true,
                    shade: 0,
                    moveOut: true,
                    area: [width, height],
                    success: function (layero, index) {
                        // 在回调方法中的第2个参数“index”表示的是当前弹窗的索引
                        // 通过layer.full方法将窗口放大
                        // layer.full(index);
                    }
                });
                layer.full(infoLayerIndex);
            } else if (obj.event === 'more') {
                // 更多下拉菜单
                dropdown.render({
                    elem: that,
                    show: true, //外部事件触发即显示
                    align: 'right',  //右对齐弹出（v2.6.8 新增）
                    style: 'box-shadow: 1px 1px 10px rgb(0 0 0 / 12%);', //设置额外样式
                    data: [{
                        title: '删除',
                        id: 'del'
                    }, {
                        title: '控制',
                        id: 'control'
                    }],
                    click: function (object) {
                        if (object.id === 'del') {
                            layer.confirm('确定删除吗？', function (index) {
                                var loading = layer.load(1, {
                                    shade: [0.1, '#fff'] //0.1透明度的白色背景
                                });
                                admin.req({
                                    type: 'delete',
                                    url: ctxPath + 'monitor-docker-container/delete-monitor-docker-container',
                                    data: JSON.stringify([{
                                        serverIp: data.serverIp,
                                        containerName: data.containerName
                                    }]),
                                    dataType: 'json',
                                    contentType: 'application/json;charset=utf-8',
                                    headers: {
                                        [[${_csrf.headerName}]]: [[${_csrf.token}]]
                                    },
                                    success: function (result) {
                                        var data = result.data;
                                        if (data === webConst.SUCCESS) {
                                            obj.del();
                                            table.reload('list-table'); //数据刷新
                                            layer.msg('删除成功！', {icon: 6});
                                        } else {
                                            layer.msg('删除失败！', {icon: 5, shift: 6});
                                        }
                                        layer.close(loading);
                                    },
                                    error: function () {
                                        layer.msg('系统错误！', {icon: 5, shift: 6});
                                        layer.close(loading);
                                    },
                                    complete: function () {
                                        layer.close(loading);
                                    }
                                });
                            });
                        }
                        if (object.id === 'control') {
                            // 宽度
                            var width;
                            // 高度
                            var height;
                            // 移动端
                            if (device.ios || device.android) {
                                // 宽度
                                width = document.body.clientWidth * 0.68 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.4 + 'px';
                            } else {
                                // 宽度
                                width = document.body.clientWidth * 0.25 + 'px';
                                // 高度
                                height = document.body.clientHeight * 0.45 + 'px';
                            }
                            layer.open({
                                type: 2,
                                title: '请选择命令',
                                content: ctxPath + 'monitor-docker-container/docker-container-control?dockerId=' + data.dockerId + '&containerId=' + data.containerId,
                                maxmin: true,
                                area: [width, height],
                                btn: ['确定', '取消'],
                                yes: function (index, layero) {
                                    var iframeWindow = window['layui-layer-iframe' + index],
                                        submitID = 'LAY-front-submit',
                                        submit = layero.find('iframe').contents().find('#' + submitID);
                                    //监听提交
                                    iframeWindow.layui.form.on('submit(' + submitID + ')', function (data) {
                                        var field = data.field; //获取提交的字段
                                        var command = field.command;
                                        var url;
                                        if (isEmpty(command)) {
                                            layer.msg('必选项不能为空！', {icon: 5, shift: 6});
                                            return;
                                        } else if (command === 'start') {
                                            url = ctxPath + 'monitor-docker-container/start-docker-container'
                                        } else if (command === 'stop') {
                                            url = ctxPath + 'monitor-docker-container/stop-docker-container'
                                        } else if (command === 'restart') {
                                            url = ctxPath + 'monitor-docker-container/restart-docker-container'
                                        } else if (command === 'destroy') {
                                            url = ctxPath + 'monitor-docker-container/destroy-docker-container'
                                        }
                                        var loading = layer.load(1, {
                                            shade: [0.1, '#fff'] //0.1透明度的白色背景
                                        });
                                        admin.req({
                                            type: 'post',
                                            url: url,
                                            data: field,
                                            dataType: 'json',
                                            headers: {
                                                [[${_csrf.headerName}]]: [[${_csrf.token}]]
                                            },
                                            success: function (result) {
                                                var code = result.code;
                                                var data = result.data;
                                                if (code === 200) {
                                                    table.reload('list-table'); //数据刷新
                                                    layer.close(index); //关闭弹层
                                                    layer.msg(data, {icon: 6});
                                                } else {
                                                    layer.msg(data, {icon: 5, shift: 6});
                                                }
                                                layer.close(loading);
                                            },
                                            error: function () {
                                                layer.msg('系统错误！', {icon: 5, shift: 6});
                                                layer.close(loading);
                                            },
                                            complete: function () {
                                                layer.close(loading);
                                            }
                                        });
                                    });
                                    submit.trigger('click');
                                }
                            });
                        }
                    }
                });
            }
        });
    });
</script>
</body>
</html>
